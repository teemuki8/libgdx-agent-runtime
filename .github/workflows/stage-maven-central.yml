name: Stage Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-central
  cancel-in-progress: false

jobs:
  stage:
    name: Stage signed artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: maven-central
      url: https://central.sonatype.com/publishing/deployments
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
      MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
      MAVEN_CENTRAL_NAMESPACE: ${{ vars.MAVEN_CENTRAL_NAMESPACE }}
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The workflow must run from a version tag such as v0.1.0."
            exit 1
          fi
          for variable_name in \
            MAVEN_CENTRAL_USERNAME \
            MAVEN_CENTRAL_PASSWORD \
            MAVEN_SIGNING_KEY \
            MAVEN_SIGNING_PASSWORD \
            MAVEN_CENTRAL_NAMESPACE
          do
            if [[ -z "${!variable_name}" ]]; then
              echo "::error::$variable_name is not configured in the maven-central environment."
              exit 1
            fi
          done
      - name: Check, sign, and upload
        shell: bash
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          xvfb-run -a ./gradlew \
            -PreleaseVersion="$release_version" \
            clean check javadoc \
            publishAllPublicationsToMavenCentralRepository \
            --warning-mode=fail
      - name: Transfer deployment to Central Portal
        shell: bash
        run: |
          set -euo pipefail
          authorization="$(
            printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" \
              | base64 \
              | tr -d '\n'
          )"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer $authorization" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/${MAVEN_CENTRAL_NAMESPACE}?publishing_type=user_managed"
