name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JDK 25 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Install Linux virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - name: Check and document on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew clean check javadoc --warning-mode=fail
      - name: Check backend-neutral code on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat clean check javadoc -x :runtime-fixtures:test --warning-mode=fail
      - name: Check backend-neutral code on macOS
        if: runner.os == 'macOS'
        run: ./gradlew clean check javadoc -x :runtime-fixtures:test --warning-mode=fail
      - name: Compile native fixture on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat :runtime-fixtures:testClasses --warning-mode=fail
      - name: Compile native fixture on macOS
        if: runner.os == 'macOS'
        run: ./gradlew :runtime-fixtures:testClasses --warning-mode=fail
      - name: Retain failed reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-reports-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            **/build/reports/**
            **/build/test-results/**
